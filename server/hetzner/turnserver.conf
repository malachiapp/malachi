# Malachi – coturn NUR als STUN-Server.
# STUN beantwortet ausschliesslich die Frage "unter welcher oeffentlichen
# Adresse sieht mich das Internet?". Es fliessen keine Nachrichten ueber
# diesen Dienst. TURN (Weiterleitung von Daten) ist bewusst abgeschaltet.
#
# Das ist der einzige Dienst, den die App noch im Netz anspricht (Adresse:
# AppConfig.js, STUN_URL). Einen Relay-/Treffpunkt-Server gibt es nicht mehr.
# Einrichtung auf einem beliebigen Linux-Server (Debian/Ubuntu):
#   apt-get install -y coturn
#   cp turnserver.conf /etc/turnserver.conf
#   systemctl enable --now coturn
#   (aeltere Debian-Pakete: zusaetzlich TURNSERVER_ENABLED=1 in /etc/default/coturn)
# Firewall: nur 3478/udp und 3478/tcp freigeben (IPv4 und IPv6).
stun-only
listening-port=3478
# Keine TLS/DTLS-Varianten noetig (STUN-Anfragen enthalten keine Inhalte).
no-tls
no-dtls
no-cli
fingerprint
no-software-attribute
# Keine Protokolle mit IP-Adressen.
no-stdout-log
log-file=/dev/null
simple-log
