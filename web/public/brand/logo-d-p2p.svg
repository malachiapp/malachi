<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Malachi – Variante D „Peer-to-Peer“: das M als Verbindung zweier Geräte
       (Knoten) mit dem Schlüsselloch im Zentrum – erzählt die Kernidee
       „direkt, ohne Server dazwischen“. Stärkstes Motiv für Marketing und
       Website, als App-Icon etwas verspielter. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101E4A"/>
      <stop offset="0.5" stop-color="#071433"/>
      <stop offset="1" stop-color="#02060F"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#36E0FF"/>
      <stop offset="0.5" stop-color="#7C8CFF"/>
      <stop offset="1" stop-color="#36E0FF"/>
    </linearGradient>
    <radialGradient id="node" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#E9FDFF"/>
      <stop offset="0.35" stop-color="#5DE6FF"/>
      <stop offset="1" stop-color="#0A7FD0"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#36E0FF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#36E0FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="232" fill="url(#bg)"/>
  <!-- feine Umlaufbahn -->
  <circle cx="512" cy="520" r="330" fill="none" stroke="#36E0FF" stroke-opacity="0.10" stroke-width="4"/>
  <circle cx="512" cy="520" r="250" fill="none" stroke="#7C8CFF" stroke-opacity="0.08" stroke-width="3" stroke-dasharray="6 18"/>
  <!-- das M als Verbindungslinie -->
  <g filter="url(#soft)">
    <path d="M286 700 V340 L512 560 L738 340 V700" fill="none" stroke="url(#line)" stroke-width="58"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Knoten (Geräte) -->
  <circle cx="286" cy="700" r="92" fill="url(#halo)"/>
  <circle cx="738" cy="700" r="92" fill="url(#halo)"/>
  <circle cx="286" cy="700" r="46" fill="url(#node)"/>
  <circle cx="738" cy="700" r="46" fill="url(#node)"/>
  <circle cx="286" cy="340" r="30" fill="url(#node)"/>
  <circle cx="738" cy="340" r="30" fill="url(#node)"/>
  <!-- Schloss/Schlüsselloch im Zentrum -->
  <circle cx="512" cy="560" r="96" fill="#071433" stroke="url(#line)" stroke-width="10"/>
  <circle cx="512" cy="542" r="26" fill="#7FEFFF"/>
  <path d="M500 556 L524 556 L534 612 L490 612 Z" fill="#7FEFFF"/>
</svg>
