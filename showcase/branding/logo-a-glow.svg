<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Malachi – Variante A „Glow Bubble“: Weiterentwicklung des bestehenden
       Icons (M mit Schlüsselloch in Sprechblase), mit Tiefe, Verlauf und
       sauberem Schlüsselloch als Aussparung. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E2E55"/>
      <stop offset="0.55" stop-color="#061A33"/>
      <stop offset="1" stop-color="#030C19"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.3" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#3FD8FF" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#3FD8FF" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#3FD8FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#7BF1FF"/>
      <stop offset="0.45" stop-color="#27C8F2"/>
      <stop offset="1" stop-color="#0A86C8"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feColorMatrix in="b" type="matrix" values="0 0 0 0 0.15  0 0 0 0 0.75  0 0 0 0 1  0 0 0 0.55 0"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <mask id="keyhole">
      <rect width="1024" height="1024" fill="#fff"/>
      <circle cx="512" cy="508" r="22" fill="#000"/>
      <path d="M502 518 L522 518 L530 566 L494 566 Z" fill="#000"/>
    </mask>
  </defs>
  <rect width="1024" height="1024" rx="232" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="232" fill="url(#shine)"/>
  <rect x="3" y="3" width="1018" height="1018" rx="229" fill="none" stroke="#3FD8FF" stroke-opacity="0.12" stroke-width="6"/>
  <g filter="url(#glow)">
    <path d="M320 228 H704 A120 120 0 0 1 824 348 V580 A120 120 0 0 1 704 700 H448 L296 806 L334 700 H320 A120 120 0 0 1 200 580 V348 A120 120 0 0 1 320 228 Z"
          fill="none" stroke="url(#ink)" stroke-width="46" stroke-linejoin="round"/>
    <path mask="url(#keyhole)" fill="url(#ink)"
          d="M347 596 V336 H432 L512 440 L592 336 H677 V596 H604 V466 L557 530 V596 H467 V530 L420 466 V596 Z"/>
  </g>
</svg>
