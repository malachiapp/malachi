#!/usr/sbin/nft -f
# Firewall des Laptops "malachi" (Website + Onion-Shop).
# Vorlage: install.sh setzt Heimnetz (LAN_V4/LAN_V6), SSH-Port und die
# Website-Ports ein und schreibt das Ergebnis nach /etc/nftables.conf.
#
# Eingehend: SSH nur aus dem Heimnetz, 80/443 fuer die Website, sonst nichts.
# Ausgehend: alles erlaubt (Tor, Updates, DuckDNS, Let's Encrypt brauchen es).
# Onion-Dienste (Website, Shop) brauchen KEINEN offenen Port - Tor baut die
# Verbindungen von innen nach aussen auf.

flush ruleset

define LAN_V4 = { @@LAN_V4@@ }
define LAN_V6 = { @@LAN_V6@@ }

table inet malachi_filter {
    chain input {
        type filter hook input priority filter; policy drop;

        ct state invalid drop
        ct state { established, related } accept
        iifname "lo" accept

        # IPv6 braucht ICMPv6 (Router-Anzeigen der FRITZ!Box, Nachbarerkennung,
        # Path-MTU) - ohne diese Pakete verliert der Laptop seine IPv6-Adresse.
        icmpv6 type { destination-unreachable, packet-too-big, time-exceeded, parameter-problem } accept
        icmpv6 type { nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } ip6 hoplimit 255 accept
        ip6 saddr fe80::/10 icmpv6 type { mld-listener-query, mld-listener-report, mld-listener-done, mld2-listener-report } accept
        icmpv6 type echo-request limit rate 5/second accept
        icmp type echo-request limit rate 5/second accept

        # DHCPv6-Antworten des Routers (vom Router an die link-lokale Adresse)
        ip6 saddr fe80::/10 udp sport 547 udp dport 546 accept

        # SSH nur aus dem Heimnetz
        ip saddr $LAN_V4 tcp dport @@SSH_PORT@@ accept
        ip6 saddr $LAN_V6 tcp dport @@SSH_PORT@@ accept

        # Website (Clearnet); bei reinem Onion-Betrieb leer
        @@WEB_PORTS@@
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
