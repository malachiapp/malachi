# Tor-Onion-Dienst fuer die Malachi-Website (wird nach /etc/tor/torrc.d/ kopiert).
# Getrennt vom Onion-Dienst des Shops (/var/lib/tor/malachi-shop/): eigene
# Adresse, eigener Schluessel. nginx lauscht dafuer nur auf 127.0.0.1:8090.

HiddenServiceDir /var/lib/tor/malachi-web/
HiddenServicePort 80 127.0.0.1:8090

# Jeder Verbindung eine PROXY-Zeile mit der Circuit-Kennung voranstellen -
# nginx begrenzt damit je Tor-Circuit statt fuer alle Tor-Nutzer gemeinsam.
HiddenServiceExportCircuitID haproxy

# Schutz der Einfuehrungspunkte vor Ueberlastung
HiddenServiceEnableIntroDoSDefense 1
HiddenServiceMaxStreams 100
HiddenServiceMaxStreamsCloseCircuit 1

# Proof-of-Work-Schutz gegen DoS (Tor >= 0.4.8, nur wenn mit PoW gebaut).
# deploy/install.sh schaltet ihn in der installierten Kopie automatisch ein,
# wenn "tor --list-modules" die Zeile "pow: yes" meldet. Die Zeile muss dafuer
# genau so (mit # am Anfang) stehen bleiben:
#HiddenServicePoWDefensesEnabled 1
