# Malachi-Website als Onion-Dienst.
# Ziel: /etc/nginx/sites-available/malachi-web-onion (Link in sites-enabled/).
#
# Tor leitet Port 80 des Onion-Dienstes hierher (torrc-malachi-web.conf).
# Nur 127.0.0.1 - von aussen nicht erreichbar. Kein TLS (Tor verschluesselt
# Ende-zu-Ende und authentifiziert die Onion-Adresse), keine Onion-Location.
# Tor stellt jeder Verbindung eine PROXY-Zeile mit der Circuit-Kennung voran
# (HiddenServiceExportCircuitID haproxy) - deshalb "proxy_protocol".

server {
    listen 127.0.0.1:8090 proxy_protocol;
    server_name _;

    set $malachi_hsts "";
    set $malachi_onion_location "";

    error_log /var/log/nginx/malachi-web-fehler.log crit;
    include /etc/nginx/snippets/malachi-web-orte.conf;
}
