# Malachi-Website im normalen Internet - Zwischenstufe OHNE Zertifikat.
# Vorlage: install.sh setzt die Domain ein und nutzt diese Datei nur, solange
# noch kein Let's-Encrypt-Zertifikat existiert. Port 80 beantwortet dann nur
# die Zertifikatspruefung (HTTP-01); alles andere bekommt 503.

server {
    listen 80;
    listen [::]:80;
    server_name @@DOMAIN@@;

    server_tokens off;
    access_log off;
    error_log /var/log/nginx/malachi-web-fehler.log crit;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/malachi-web/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 503;
    }
}
