# Malachi-Website - TLS-Einstellungen (Mozilla "intermediate", Stand 2026).
# Ziel: /etc/nginx/snippets/malachi-web-tls.conf
#
# Schluesseltausch: Bewusst KEIN ssl_ecdh_curve - mit OpenSSL 3.5 (Debian 13)
# bietet nginx dann die OpenSSL-Standardgruppen an, darunter den hybriden
# Post-Quanten-Schluesseltausch X25519MLKEM768 (pruefen: pruefen.sh).
# OCSP-Stapling ist aus: Let's Encrypt betreibt seit 2025 keinen OCSP-Dienst mehr.

ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;
ssl_session_timeout 1d;
ssl_session_cache shared:MalachiTLS:10m;
ssl_session_tickets off;
ssl_stapling off;
