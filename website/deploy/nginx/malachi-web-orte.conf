# Malachi-Website - gemeinsamer Inhalt von Onion- und Clearnet-Server.
# Ziel: /etc/nginx/snippets/malachi-web-orte.conf (im server-Block einbinden).
# Beide Adressen liefern dieselben Dateien aus: /var/www/malachi/aktuell
# (Symlink auf die aktive Version, umgeschaltet von malachi-web-aktivieren).

root /var/www/malachi/aktuell;
index index.html;
charset utf-8;
charset_types text/html text/plain text/css application/json image/svg+xml;

# Datenschutz: kein Zugriffsprotokoll (keine IP-Adressen auf der Platte).
access_log off;
server_tokens off;

# Weiterleitungen relativ - nie den internen Port 8090 oder einen fremden
# Hostnamen in einen Location-Header schreiben (wichtig fuer die Onion-Adresse).
absolute_redirect off;
port_in_redirect off;

# Unterhalb der Wurzel keine symbolischen Links folgen (die Wurzel selbst ist einer).
disable_symlinks on from=$document_root;

# Statische Seite: keine Uploads, knappe Zeitlimits.
client_max_body_size 1k;
client_body_timeout 10s;
client_header_timeout 10s;
keepalive_timeout 20s;
send_timeout 60s;

expires $malachi_ablauf;
limit_req zone=malachi_seiten burst=40 nodelay;

include /etc/nginx/snippets/malachi-web-header.conf;

if ($request_method !~ ^(GET|HEAD)$) {
    return 405;
}

error_page 404 /404.html;

location / {
    try_files $uri $uri.html $uri/ =404;
}

location = /404.html {
    internal;
}

# Versteckte Dateien nie ausliefern (ausser /.well-known/).
location ~ /\.(?!well-known/) {
    return 404;
}

# Downloads und signierte Updates (Format: website/UPDATE_FORMAT.md).
location ^~ /updates/ {
    types {
        application/json                        json;
        text/plain                              sig txt pem;
        application/vnd.android.package-archive apk;
    }
    default_type text/plain;
    try_files $uri =404;

    location ~ \.apk$ {
        include /etc/nginx/snippets/malachi-web-header.conf;
        add_header Content-Disposition "attachment" always;
        # je Gegenstelle 2 gleichzeitige Downloads, insgesamt 20 je Port,
        # nach dem ersten MB hoechstens 1 MB/s je Verbindung
        limit_conn malachi_dl_je 2;
        limit_conn malachi_dl_gesamt 20;
        limit_rate_after 1m;
        limit_rate 1m;
        try_files $uri =404;
    }
}
