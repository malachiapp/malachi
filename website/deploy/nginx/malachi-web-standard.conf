# Malachi-Website - Auffang-Server fuer alle unbekannten Hostnamen.
# Ziel: /etc/nginx/sites-available/malachi-web-standard (ersetzt Debians "default").
#
# Wer den Laptop nur ueber seine IP-Adresse oder einen fremden Namen anspricht
# (Scanner), bekommt nichts: HTTP wird ohne Antwort geschlossen (444), TLS
# ohne Zertifikat abgelehnt - der Hostname der Website wird so nicht verraten.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_reject_handshake on;
    server_tokens off;
    access_log off;
    error_log /var/log/nginx/malachi-web-fehler.log crit;

    return 444;
}
