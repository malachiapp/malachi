# Malachi-Website - Sicherheits-Header (fuer Onion und Clearnet gleich).
# Ziel: /etc/nginx/snippets/malachi-web-header.conf
#
# ACHTUNG nginx-Falle: Ein add_header in einer location ersetzt ALLE
# add_header der Ebene darueber. Jede location mit eigenem add_header muss
# diese Datei deshalb selbst noch einmal einbinden.
#
# $malachi_hsts und $malachi_onion_location setzt jeder server-Block selbst
# (Onion: leer -> der Header wird nicht gesendet; Clearnet: HSTS + Onion-Location).

add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "accelerometer=(), autoplay=(), browsing-topics=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), usb=(), xr-spatial-tracking=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Strict-Transport-Security $malachi_hsts always;
add_header Onion-Location $malachi_onion_location always;
