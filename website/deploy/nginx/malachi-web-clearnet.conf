# Malachi-Website im normalen Internet (HTTPS mit Let's-Encrypt-Zertifikat).
# Vorlage: install.sh setzt Domain und Onion-Adresse ein und schreibt das
# Ergebnis nach /etc/nginx/sites-available/malachi-web-clearnet.
#
# Port 80 dient nur der Zertifikatspruefung (HTTP-01) und der Weiterleitung
# auf HTTPS. Die Inhalte sind dieselben wie beim Onion-Dienst.

server {
    listen 80;
    listen [::]:80;
    server_name @@DOMAIN@@;

    server_tokens off;
    access_log off;
    error_log /var/log/nginx/malachi-web-fehler.log crit;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/malachi-web/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://@@DOMAIN@@$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name @@DOMAIN@@;

    ssl_certificate     /etc/letsencrypt/live/malachi-web/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/malachi-web/privkey.pem;
    include /etc/nginx/snippets/malachi-web-tls.conf;

    # HSTS ohne includeSubDomains/preload (fremde Domain, z. B. DuckDNS).
    set $malachi_hsts "max-age=31536000";
    # Tor-Browser bietet damit automatisch die Onion-Adresse an.
    set $malachi_onion_location "http://@@ONION@@$request_uri";

    error_log /var/log/nginx/malachi-web-fehler.log crit;
    include /etc/nginx/snippets/malachi-web-orte.conf;
}
