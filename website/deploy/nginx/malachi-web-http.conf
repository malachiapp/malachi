# Malachi-Website - Einstellungen im http-Kontext.
# Ziel: /etc/nginx/conf.d/malachi-web.conf (Debian bindet conf.d/*.conf im http-Block ein).

# Wer ist "eine Gegenstelle" fuer die Ratenbegrenzung?
#  - Clearnet: die IP-Adresse.
#  - Onion: der Tor-Circuit. Tor schickt ihn per PROXY-Protokoll als
#    Pseudo-Adresse (HiddenServiceExportCircuitID haproxy, siehe
#    torrc-malachi-web.conf) - sonst kaemen alle Tor-Nutzer von 127.0.0.1 und
#    wuerden sich ein gemeinsames Limit teilen.
map $proxy_protocol_addr $malachi_gegenstelle {
    ""      $binary_remote_addr;
    default $proxy_protocol_addr;
}

# Seiten: 10 Anfragen/s je Gegenstelle, Stoss bis 40.
limit_req_zone  $malachi_gegenstelle zone=malachi_seiten:10m rate=10r/s;
# Downloads: gleichzeitige Verbindungen je Gegenstelle und insgesamt je Port
# (443 = Clearnet, 8090 = Onion) - schont den Upload des Heimanschlusses.
limit_conn_zone $malachi_gegenstelle zone=malachi_dl_je:10m;
limit_conn_zone $server_port zone=malachi_dl_gesamt:1m;
limit_req_status  429;
limit_conn_status 429;

# Zwischenspeichern im Browser: HTML, JSON (Manifest) und Text nie ohne
# Rueckfrage, APKs einen Tag (Dateiname enthaelt die Version), Rest eine Stunde.
map $sent_http_content_type $malachi_ablauf {
    default                                       1h;
    ~^text/html                                   epoch;
    ~^application/json                            epoch;
    ~^text/plain                                  epoch;
    ~^application/vnd\.android\.package-archive   1d;
}
