# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx512m -XX:MaxMetaspaceSize=256m
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# Automatically convert third-party libraries to use AndroidX
android.enableJetifier=true
# BouncyCastle ab 1.86 enthaelt Multi-Release-Klassen fuer Java 25
# (META-INF/versions/25, Klassenformat 69), an denen Jetifier scheitert. BC
# nutzt keine Android-Support-Bibliothek - Jetifier hat dort nichts zu tun.
# D8 dext nur die Basisklassen (Java 8), META-INF/versions wird ignoriert.
android.jetifier.ignorelist=bcprov-jdk18on

# Use this property to specify which architecture you want to build.
# You can also override it from the CLI using
# ./gradlew <task> -PreactNativeArchitectures=x86_64
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# Use this property to enable or disable the Hermes JS engine.
# If set to false, you will be using JSC instead.
hermesEnabled=true

# Use this property to enable edge-to-edge display support.
# This allows your app to draw behind system bars for an immersive UI.
# Note: Only works with ReactActivity and should not be used with custom Activity.
edgeToEdgeEnabled=false

# Use this property to enable or disable the New Architecture (Fabric/TurboModules).
# RN's OWN gradle-plugin ignores this since 0.82 (New Architecture is now
# unconditional - see @react-native/gradle-plugin's ReactRootProjectPlugin).
# BUT several third-party native deps (react-native-svg, safe-area-context,
# netinfo, camera-roll, vector-icons, image-picker, async-storage,
# react-native-camera-kit) still gate their OWN newarch-vs-oldarch Android
# source-set selection on this exact property in their own build.gradle.
# Leaving it unset/false silently built ALL of those against their legacy
# (pre-Fabric) source sets while the rest of the app runs New Architecture -
# discovered via the QR scanner: camera preview still rendered (basic View
# interop works), but scanBarcode/onReadCode never fired because
# CKCameraManager's oldarch variant was never wired to the codegen'd Fabric
# delegate. Must be the literal string "true" - these libraries' checks are
# `project.newArchEnabled == "true"`, not a boolean coercion.
newArchEnabled=true

# Paketname (App-ID) der Google-Play-Variante (Flavor "play", PLAY_STORE.md).
# ENDGUELTIG ab dem ersten Hochladen in die Play Console - erst nach
# Bestaetigung durch den Inhaber einkommentieren. Ohne diese Zeile brechen
# Release-Builds der Play-Variante (bundlePlayRelease) bewusst ab.
# Die Website-Variante bleibt immer "com.securecommapp".
# Festgelegt am 2026-10-19 (Domain malachi.app) - nach dem ersten Hochladen ENDGUELTIG.
playApplicationId=de.malachiapp
